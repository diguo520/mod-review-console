# Cloudflare Pages 项目配置。
#
# 本地跑 wrangler pages dev 时靠它拿到 DB 绑定；线上 Git 构建也会读取本文件，
# 但**线上真正生效的绑定以 Pages 项目设置里的那份为准**（部署脚本会同时写一份，
# 两边指向同一个 D1，避免出现「本地能跑、线上 DB 未定义」）。
name = "mod-review-console"
compatibility_date = "2026-09-23"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "mod-review-console-db"
database_id = "cdec0d34-cc64-47f6-81d1-393cca38e4c2"
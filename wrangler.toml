# Cloudflare Pages 项目配置。
#
# ⚠️ 本文件是**变量与绑定的唯一事实来源**：一旦仓库里有 wrangler.toml，
# Cloudflare 每次构建都会按它来配置部署，控制台/API 上手写的普通变量会被覆盖掉。
# 所以普通变量写在下面 [vars]，**密钥不能写这里**（仓库是公开的），
# 密钥用 `wrangler pages secret put` 或控制台 Variables and secrets 配。
name = "mod-review-console"
compatibility_date = "2026-09-23"
pages_build_output_dir = "dist"

[vars]
# 管理员账号。密码不在这里：用 ADMIN_PASSWORD_HASH(推荐) 或 ADMIN_PASSWORD，
# 两者都是密钥，见文件头说明。
ADMIN_USER = "diguo520"
# 登录有效期(小时)，留空则默认 12
SESSION_TTL_HOURS = "12"

[[d1_databases]]
binding = "DB"
database_name = "mod-review-console-db"
database_id = "cdec0d34-cc64-47f6-81d1-393cca38e4c2"